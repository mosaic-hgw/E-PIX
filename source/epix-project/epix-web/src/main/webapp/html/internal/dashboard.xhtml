<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:component="http://java.sun.com/jsf/composite/components"
	  xmlns:dashboard="http://java.sun.com/jsf/composite/components/dashboard"
	  xmlns:f="http://java.sun.com/jsf/core"
	  xmlns:h="http://java.sun.com/jsf/html"
	  xmlns:p="http://primefaces.org/ui"
	  xmlns:ui="http://java.sun.com/jsf/facelets">

<body>
<ui:composition template="/resources/templates/epix.xhtml">

	<ui:composition template="/resources/templates/epix.xhtml">

		<ui:define name="header_title">
			<h:outputText value="#{msg['page.dashboard.title']}" />
		</ui:define>

		<ui:define name="title">
			<h:outputText value="#{msg['page.dashboard.title']}" />
		</ui:define>

		<ui:define name="help">
			<h:outputText value="#{cmsg['welcome.help']}" escape="false" styleClass="desktop-only" />
			<h:outputText value="#{cmsg['welcome.help.mobile']}" escape="false" styleClass="mobile-only" />
		</ui:define>

		<ui:define name="content">
			<f:event listener="#{dashboardController.checkDomainChange}" type="preRenderView" />

			<h:form id="main" onkeypress="return event.keyCode != 13">
				<p:panel rendered="#{dashboardController.selectedDomain == null}">
					<h:outputText value="#{msg['page.dashboard.noDomain']}" />
				</p:panel>
				<p:panel rendered="#{dashboardController.selectedDomain != null and !dashboardController.hasStats}">
					<h:outputText value="#{msg['page.dashboard.empty']}" />
					<p:commandButton actionListener="#{dashboardController.updateStats}" icon="mdi mdi-refresh" styleClass="secondary" update="@form" value="#{cmsg['ui.button.refresh']}"
									 onclick="PF('loading').show()" oncomplete="PF('loading').hide()" />
				</p:panel>

				<div class="grid">
					<ui:fragment rendered="#{dashboardController.selectedDomain != null and dashboardController.hasStats}">
						<div class="col-12 section-heading justify-content-between gap-3">
							<div class="flex align-items-center gap-3">
								<h:outputText value="#{msg['page.dashboard.domain.statsFor']} " />
								<p:selectOneButton value="#{dashboardController.domain}" unselectable="false">
									<f:selectItem itemLabel="#{dashboardController.selectedDomain.label}" itemValue="CURRENT" />
									<f:selectItem itemLabel="#{msg['page.dashboard.domain.ALL']}" itemValue="ALL"
												  itemDisabled="#{not dashboardController.hasSummaryStats}" />
									<p:ajax process="@this" update="main" />
								</p:selectOneButton>
							</div>
						</div>
					</ui:fragment>

					<ui:fragment rendered="#{dashboardController.selectedDomain != null  and dashboardController.hasStatsInTimespan}">
						<!-- All domains -->
						<div class="col-12 md:col-8">
							<p:panel style="margin-bottom: 0">
								<div class="overview flex flex-wrap">
									<ui:repeat value="#{dashboardController.latestStatsLabels.entrySet()}" var="_stat" varStatus="_i">
										<div class="box">
											<div>
												<h:outputText styleClass="title block text-center"
															  value="#{dashboardController.stats.mappedStatValue.get(_stat.key) == null?0:dashboardController.stats.mappedStatValue.get(_stat.key)}" />
												<h:outputText styleClass="details block text-center" style="display: table-caption !important;" value="#{_stat.value}" />
											</div>
											<p:divider layout="vertical" />
										</div>
									</ui:repeat>
									<div class="box">
										<div>
											<p:commandButton ajax="false" icon="mdi mdi-download" styleClass="secondary title block text-center" value="#{cmsg['page.dashboard.export.current']}">
												<p:fileDownload
														value="#{dashboardController.latestStatsDownload}" />
											</p:commandButton>
										</div>
										<p:divider layout="vertical" />
									</div>
									<div class="box">
										<p:outputPanel deferred="true" loaded="#{dashboardController.rangeStatsLoaded}" layout="block">
											<p:ajax event="load" listener="#{dashboardController.loadRangeStats}" ignoreAutoUpdate="true" />
											<f:facet name="loading">
												<p:skeleton shape="rectangle" width="105px" height="68px" />
											</f:facet>
											<p:commandButton ajax="false" icon="mdi mdi-download" styleClass="secondary title block text-center" value="#{cmsg['page.dashboard.export.history']}">
												<p:fileDownload
														value="#{dashboardController.historyStatsDownload}" />
											</p:commandButton>
										</p:outputPanel>
									</div>
								</div>
							</p:panel>
						</div>

						<!-- Meta -->
						<div class="col-12 md:col-4">
							<p:panel styleClass="h-full">
								<div class="overview flex flex-wrap" style="min-height: 98px;">
									<div class="box">
										<div>
											<h:outputText styleClass="title block text-center" value="#{webUtil.showTimeInAutoFormat(dashboardController.latestStatsCalculationTime)}" />
											<h:outputText styleClass="details block text-center" value="#{cmsg['page.dashboard.meta.calculation']}" />
										</div>
										<p:divider layout="vertical" />
									</div>
									<div class="box">
										<div>
											<p:commandButton icon="mdi mdi-calendar-clock-outline" process="@this" onclick="PF('date_dialog').show();"
															 style="margin: -5px auto 0 auto; padding-bottom: 4px" styleClass="title block text-center secondary"
															 value="#{cmsg['page.dashboard.meta.latestDateTime']}" />
											<h:outputText styleClass="details block text-center z-1 text-xs" style="margin-bottom: -20px" value="#{dashboardController.latestStatsDateTimeString}" />
										</div>
										<p:divider layout="vertical" />
									</div>
									<div class="box">
										<div>
											<p:commandButton actionListener="#{dashboardController.updateStats}" icon="mdi mdi-refresh" styleClass="secondary title block text-center"
															 update="@form"
															 value="#{cmsg['ui.button.refresh']}" onclick="PF('loading').show();" oncomplete="PF('loading').hide();" />
										</div>
									</div>
								</div>
							</p:panel>
						</div>

						<!-- Person + Identity History -->
						<p:outputPanel styleClass="col-12 xl:col-6" deferred="true" loaded="#{dashboardController.rangeStatsLoaded}" layout="block">
							<f:facet name="loading">
								<p:panel styleClass="h-full">
									<h:outputText value="#{msg['page.dashboard.persons.history']}" styleClass="font-bold block" style="margin-bottom: 20px" />
									<p:skeleton shape="rectangle" width="100%" height="300px" />
								</p:panel>
							</f:facet>

							<dashboard:line_chart
									download="#{dashboardController.getLineChartAsCsv(dashboardController.personsIdentitiesHistoryChart, dashboardController.selectedDomain.name.concat(' persons_identities history'), dashboardController.tool)}"
									lineChart="#{dashboardController.personsIdentitiesHistoryChart}"
									title="#{msg['page.dashboard.persons.history']}" />
						</p:outputPanel>

						<!-- Person + Identity Bar Chart -->
						<p:outputPanel styleClass="col-12 xl:col-4" deferred="true" loaded="#{dashboardController.rangeStatsLoaded}" layout="block">
							<f:facet name="loading">
								<p:panel styleClass="h-full">
									<h:outputText value="#{msg['page.dashboard.persons.accumulation']}" styleClass="font-bold block" style="margin-bottom: 20px" />
									<p:skeleton shape="rectangle" width="100%" height="300px" />
								</p:panel>
							</f:facet>

							<dashboard:bar_chart
									download="#{dashboardController.getBarChartAsCsv(dashboardController.personsIdentitiesBarScale == 'MONTHS_12' ? dashboardController.personsIdentityMonthChart : dashboardController.personsIdentityYearChart, dashboardController.selectedDomain.name.concat(' persons_identities increase'), dashboardController.tool)}"
									scale="#{dashboardController.personsIdentitiesBarScale}"
									availableScales="#{dashboardController.availableBarScales}"
									barChartMonths="#{dashboardController.personsIdentityMonthChart}"
									barChartYears="#{dashboardController.personsIdentityYearChart}"
									title="#{msg['page.dashboard.persons.accumulation']}" />
						</p:outputPanel>

						<!-- Person + Identity Ratio -->
						<div class="col-12 xl:col-2">
							<p:panel styleClass="h-full">
								<h4>
									#{msg['page.dashboard.persons']}
								</h4>
								<div style="height: 100%; vertical-align: middle">
									<h:outputText style="font-size: 3em; text-align: center; display: block"
												  value="#{webUtil.round(dashboardController.personsIdentitiesRatio , 2)}" />
									<h:outputText style="font-size: 1em; opacity: 0.8; text-align: center; display: block"
												  value="#{msg['page.dashboard.persons.ratio.personsIdentities']}" />

									<h:outputText style="font-size: 3em; text-align: center; display: block; margin-top: 18px;"
												  value="#{webUtil.round(dashboardController.identityPossibleMatchRatio , 2)}" />
									<h:outputText style="font-size: 1em; opacity: 0.8; text-align: center; display: block"
												  value="#{msg['page.dashboard.persons.ratio.identityPossibleMatch']}" />

									<h:outputText style="font-size: 3em; text-align: center; display: block; margin-top: 18px;"
												  value="#{webUtil.round(dashboardController.identityMatchRatio , 2)}" />
									<h:outputText style="font-size: 1em; opacity: 0.8; text-align: center; display: block"
												  value="#{msg['page.dashboard.persons.ratio.identityMatch']}" />
								</div>
							</p:panel>
						</div>

						<!-- Matching Current -->
						<div class="col-12 xl:col-6">
							<dashboard:pie_chart
									download="#{dashboardController.getPieChartAsCsv(dashboardController.getMatchingChart(false), dashboardController.stats.entrydate,dashboardController.selectedDomain.name.concat(' matching latest'), dashboardController.tool)}"
									pieChartDesktop="#{dashboardController.getMatchingChart(false)}"
									pieChartMobile="#{dashboardController.getMatchingChart(true)}"
									title="#{msg['page.dashboard.matching']}"
									hint="#{msg['page.dashboard.matching.hint']}" />
						</div>

						<!-- Matching History -->
						<p:outputPanel styleClass="col-12 xl:col-6" deferred="true" loaded="#{dashboardController.rangeStatsLoaded}" layout="block">
							<f:facet name="loading">
								<p:panel styleClass="h-full">
									<h:outputText value="#{msg['page.dashboard.matching.history']}" styleClass="font-bold block" style="margin-bottom: 20px" />
									<p:skeleton shape="rectangle" width="100%" height="300px" />
								</p:panel>
							</f:facet>

							<dashboard:line_chart
									download="#{dashboardController.getLineChartAsCsv(dashboardController.matchingHistoryChart, dashboardController.selectedDomain.name.concat(' matching history'), dashboardController.tool)}"
									lineChart="#{dashboardController.matchingHistoryChart}"
									title="#{msg['page.dashboard.matching.history']}" />
						</p:outputPanel>

						<!-- Possible Matches Current -->
						<div class="col-12 xl:col-6">
							<dashboard:pie_chart
									download="#{dashboardController.getPieChartAsCsv(dashboardController.getPossibleMatchesChart(false), dashboardController.stats.entrydate,dashboardController.selectedDomain.name.concat(' possible_matches latest'), dashboardController.tool)}"
									pieChartDesktop="#{dashboardController.getPossibleMatchesChart(false)}"
									pieChartMobile="#{dashboardController.getPossibleMatchesChart(true)}"
									title="#{msg['page.dashboard.possibleMatches']}"
									hint="#{msg['page.dashboard.possibleMatches.hint']}" />
						</div>

						<!-- Possible Matches History -->
						<p:outputPanel styleClass="col-12 xl:col-6" deferred="true" loaded="#{dashboardController.rangeStatsLoaded}" layout="block">
							<f:facet name="loading">
								<p:panel styleClass="h-full">
									<h:outputText value="#{msg['page.dashboard.possibleMatches.history']}" styleClass="font-bold block" style="margin-bottom: 20px" />
									<p:skeleton shape="rectangle" width="100%" height="300px" />
								</p:panel>
							</f:facet>
							<dashboard:line_chart
									download="#{dashboardController.getLineChartAsCsv(dashboardController.possibleMatchesHistoryChart, dashboardController.selectedDomain.name.concat(' possible_matches history'), dashboardController.tool)}"
									lineChart="#{dashboardController.possibleMatchesHistoryChart}"
									title="#{msg['page.dashboard.possibleMatches.history']}" />
						</p:outputPanel>
					</ui:fragment>
				</div>
			</h:form>
			<component:dummy />
			<dashboard:range_dialog id="range_dialog_component" startDate="#{dashboardController.rangeStartDate}"
									endDate="#{dashboardController.rangeEndDate}"
									minDate="#{dashboardController.statsMinDate}"
									maxDate="#{dashboardController.statsDate}"
									dateChangeListener="#{dashboardController.onDateChange}"
									update=":main" />
			<dashboard:date_dialog date="#{dashboardController.statsDate}"
								   dateChangeListener="#{dashboardController.onDateChange}"
								   minDate="#{dashboardController.statsMinDate}"
								   maxDate="#{dashboardController.statsMaxDate}"
								   update=":main" />
			<!-- ${disclaimer.enable.start}
			<component:demo_disclaimer/>
			${disclaimer.enable.end} -->
		</ui:define>

	</ui:composition>
</ui:composition>
</body>
</html>
