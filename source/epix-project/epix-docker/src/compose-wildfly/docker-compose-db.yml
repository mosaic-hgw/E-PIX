version: '3.7'
services:
  wildfly:
    image: mosaicgreifswald/wildfly-db:${docker.wildfly.version}
    container_name: ${project.shortName}-wildfly-db
    ports:
      - "3306:3306"
#      - "8787:8787"
      - "8080:8080"
      - "9990:9990"
    env_file:
      - ./envs/mysql.env
      - ./envs/ttp_commons.env
      - ./envs/ttp_${project.shortName}.env
      - ./envs/ttp_gras.env
      - ./envs/ttp_noti.env
      - ./envs/wf_commons.env
    volumes:
#      - ./addins:${docker.wildfly.addins}
      - ./jboss:${docker.wildfly.jboss}
      - ./deployments:${docker.wildfly.deployments}
      - ./logs:${docker.wildfly.logs}
      - ./sqls:${docker.wildfly.sqls}
#      - ./data/mysql:${docker.wildfly.dbdata}

